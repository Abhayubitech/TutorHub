<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TutorHub</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
  <style type="text/css">
    #app-loader {
      position: fixed;
      z-index: 99999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff; 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.8s ease-out, visibility 0.8s;
    }

    @media (prefers-color-scheme: dark) {
      #app-loader {
        background-color: #020617; 
      }
    }

    .loader-logo-box {
      position: relative;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #2563eb, #9333ea); 
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: white;
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
      animation: float 3s ease-in-out infinite;
      z-index: 10;
    }

    .loader-logo-box::before,
    .loader-logo-box::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      border-radius: 20px;
      border: 2px solid #2563eb;
      opacity: 0;
      z-index: -1;
      animation: ripple 2s infinite cubic-bezier(0, 0.2, 0.8, 1);
    }
    .loader-logo-box::after {
      animation-delay: 0.5s; 
    }

    .loader-title {
      margin-top: 25px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #1e293b 20%, #2563eb 40%, #2563eb 60%, #1e293b 80%);
      background-size: 200% auto;
      color: #000;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite;
    }
    
    @media (prefers-color-scheme: dark) {
      .loader-title {
        background: linear-gradient(to right, #ffffff 20%, #60a5fa 40%, #60a5fa 60%, #ffffff 80%);
        background-size: 200% auto;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    }

    .loader-progress {
      width: 150px;
      height: 4px;
      background: #e2e8f0; 
      border-radius: 10px;
      margin-top: 15px;
      overflow: hidden;
      position: relative;
    }
    @media (prefers-color-scheme: dark) {
      .loader-progress { background: #1e293b; }
    }

    .loader-progress-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb, #9333ea);
      border-radius: 10px;
      animation: loadProgress 2s ease-in-out forwards; 
    }

    @keyframes ripple {
      0% { width: 100%; height: 100%; opacity: 0.8; border-color: #2563eb; }
      100% { width: 200%; height: 200%; opacity: 0; border-color: #9333ea; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    @keyframes loadProgress {
      0% { width: 0%; }
      50% { width: 40%; }
      80% { width: 70%; }
      100% { width: 100%; }
    }

    .loader-hidden {
      opacity: 0;
      visibility: hidden;
      filter: blur(10px); 
      transform: scale(1.1); 
    }
  </style>
</head>
<body>

  <div id="app-loader">
    <div class="loader-logo-box">
      🎓
    </div>
    
    <div class="loader-title">TutorHub</div>
    
    <div class="loader-progress">
      <div class="loader-progress-bar"></div>
    </div>
  </div>

  <app-root></app-root>

  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.classList.add('loader-hidden');
          setTimeout(() => { loader.remove(); }, 800);
        }
      }, 2000); 
    });
  </script>

</body>
</html>
