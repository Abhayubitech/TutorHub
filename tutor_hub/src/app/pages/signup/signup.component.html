<div class="signup-container">
  <div class="signup-card">
    <h2>Create Account</h2>

    @if (error) {
      <div class="error-message">{{ error }}</div>
    }

    <form (ngSubmit)="signup()">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          placeholder="Enter your full name"
          [(ngModel)]="name"
          [ngModelOptions]="{ updateOn: 'blur' }"
          name="name"
          maxlength="33"
          pattern="[a-zA-Z\s'-]*"
          required
          title="Name can only contain letters, spaces, hyphens, and apostrophes"
        />
        <small>Letters only, max 33 characters</small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter your email"
          [(ngModel)]="email"
          [ngModelOptions]="{ updateOn: 'blur' }"
          name="email"
          maxlength="100"
          pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
          required
          title="Please enter a valid email address"
        />
        <small>Example: user&#64;example.com</small>
      </div>

      <div class="form-group">
        <label>Phone (Optional)</label>
        <input
          type="tel"
          placeholder="Enter your phone number"
          [(ngModel)]="phone"
          [ngModelOptions]="{ updateOn: 'blur' }"
          name="phone"
          maxlength="20"
          pattern="[\d+\-\s()]*"
          title="Phone can only contain digits, +, -, spaces, and parentheses"
        />
        <small>Numbers and +, -, (), spaces only. Max 20 characters</small>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="role" [ngModelOptions]="{ updateOn: 'blur' }" name="role" required>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Enter your password"
            [(ngModel)]="password"
            [ngModelOptions]="{ updateOn: 'blur' }"
            name="password"
            minlength="6"
            maxlength="100"
            required
            title="Password must be at least 6 characters long"
          />
          <button type="button" (click)="togglePasswordVisibility()" class="toggle-btn">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        <small>Minimum 6 characters</small>
      </div>

      <button
        type="submit"
        class="signup-btn"
        [disabled]="isLoading || !name() || !email() || !password() || !role()"
      >
        {{ isLoading ? 'Creating Account...' : 'Sign Up' }}
      </button>
    </form>

    <p class="login-link">
      Already have an account? <a (click)="goToLogin()">Login here</a>
    </p>
  </div>
</div>
