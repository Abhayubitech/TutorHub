<div class="login-container">
  <div class="logo-header">
    <h1 class="logo" (click)="goHome()">
      <span class="logo-icon">🎓</span> TutorHub
    </h1>
  </div>
  
  <div class="login-card">
    <h2>Login</h2>

    @if (error) {
      <div class="error-message">{{ error }}</div>
    }

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label>Quick Demo Access</label>
        <select (change)="onDemoChange($event)" class="demo-select">
          <option value="">Choose demo account...</option>
          <option value="admin">Admin Demo</option>
          <option value="teacher">Teacher Demo</option>
          <option value="student">Student Demo</option>
        </select>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          placeholder="Enter your email"
          [(ngModel)]="email"
          [ngModelOptions]="{ updateOn: 'blur' }"
          name="email"
          maxlength="33"
          pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
          required
          title="Please enter a valid email address"
        >
        <small>Example: user&#64;example.com</small>
        <small *ngIf="email() && !isValidEmail(email())" class="error">Valid email is required</small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-input">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="Enter your password"
            [(ngModel)]="password"
            [ngModelOptions]="{ updateOn: 'blur' }"
            name="password"
            maxlength="11"
            required
            title="Password must be 11 characters or less"
          >
          <button type="button" (click)="togglePasswordVisibility()" class="toggle-btn">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
        <small>Max 11 characters</small>
        <small *ngIf="password() && password().length === 0" class="error">Password is required</small>
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="isLoading || !email() || !password()"
      >
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="signup-link">
      Don't have an account? <a (click)="goToSignup()">Sign up here</a>
    </p>
  </div>
</div>
