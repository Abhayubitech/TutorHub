<div class="min-h-screen flex items-center justify-center p-4 font-sans bg-gradient-to-br from-blue-600 via-indigo-700 to-purple-800 relative overflow-hidden">

  <div class="absolute top-0 right-0 w-96 h-96 bg-white opacity-10 rounded-full blur-3xl translate-x-20 -translate-y-20 pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-purple-500 opacity-20 rounded-full blur-3xl -translate-x-20 translate-y-20 pointer-events-none"></div>

  <div class="relative w-full max-w-[400px] bg-white rounded-2xl shadow-2xl overflow-hidden animate-enter">
    
    <div class="h-1.5 w-full bg-gradient-to-r from-blue-500 to-purple-600"></div>

    <div class="p-8 sm:p-10">
      
      <div class="text-center mb-8">
        <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">
          Welcome Back
        </h1>
        <p class="mt-2 text-slate-500 text-sm">
          Sign in to your <span class="text-indigo-600 font-bold">TutorHub</span> account.
        </p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div>
            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">Email Address</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
                </div>
                <input type="email" formControlName="email" placeholder="name@example.com"
                    class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 shadow-sm"
                >
            </div>
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-500 text-xs mt-1 font-semibold">
              Valid email is required.
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider">Password</label>
              <a href="#" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 transition-colors">Forgot Password?</a>
            </div>
            
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                </div>
                <input type="password" formControlName="password" placeholder="••••••••"
                    class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-900 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all duration-200 shadow-sm"
                >
            </div>
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="text-red-500 text-xs mt-1 font-semibold">
              Password is required.
            </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid"
            class="w-full py-3.5 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-lg shadow-lg shadow-indigo-500/30 transform hover:-translate-y-0.5 transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
        >
            Sign In
        </button>

      </form>

      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <p class="text-sm text-slate-500">
          New here? 
          <a routerLink="/signup" class="font-bold text-indigo-600 hover:text-indigo-800 transition-colors ml-1">
            Create an Account
          </a>
        </p>
      </div>

    </div>
  </div>
</div>
