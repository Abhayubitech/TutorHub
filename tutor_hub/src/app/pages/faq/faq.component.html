<section class="page">
  <div class="container">
    <header class="hero">
      <h2>Frequently Asked Questions</h2>
      <p>Find answers to common questions about TutorHub</p>
    </header>

    <div class="faq-container">
      <div class="faq-item" *ngFor="let faq of faqs; let i = index">
        <div class="faq-question" (click)="toggleAnswer(i)">
          <h3>{{ faq.question }}</h3>
          <i class="fas fa-chevron-down"></i>
        </div>
        <div class="faq-answer" id="faq-answer-{{i}}">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
    </div>

    <div class="contact-support">
      <h3>Still have questions?</h3>
      <p>Can't find the answer you're looking for? Our support team is here to help.</p>
      <a routerLink="/support" class="btn-primary">Contact Support</a>
    </div>
  </div>
</section>
