<section class="page">
  <div class="container">
    <header class="hero">
      <h2>Contact</h2>
      <p>Have a question? Send us a message and our team will respond as soon as possible.</p>
    </header>

    <div class="content">
      <div class="info">
        <div class="info-card">
          <div class="label">Email</div>
          <div class="value">ayushgoyal6&#64;zohomail.in</div>
        </div>
        <div class="info-card">
          <div class="label">Phone</div>
          <div class="value">+91 9630079633</div>
        </div>
        <div class="info-card">
          <div class="label">Location</div>
          <div class="value">Gyan Ganga Building, Sindh Vihar Colony, Gwalior</div>
        </div>
      </div>

      <form class="form" (ngSubmit)="submitContact()">
        <div class="form-group">
          <label>Your Name</label>
          <input
            type="text"
            placeholder="Your Name"
            [(ngModel)]="contactName"
            name="contactName"
            maxlength="33"
            pattern="[a-zA-Z\s'-]*"
            title="Name can only contain letters, spaces, hyphens, and apostrophes (max 33 characters)"
            (input)="onNameChange()"
            required
          />
          <small *ngIf="nameError" class="error">{{ nameError }}</small>
        </div>

        <div class="form-group">
          <label>Your Email</label>
          <input
            type="email"
            placeholder="Your Email"
            [(ngModel)]="contactEmail"
            name="contactEmail"
            pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
            title="Please enter a valid email address"
            (input)="onEmailChange()"
            required
          />
          <small *ngIf="emailError" class="error">{{ emailError }}</small>
        </div>

        <div class="form-group">
          <label>Subject</label>
          <input
            type="text"
            placeholder="Subject"
            [(ngModel)]="contactSubject"
            name="contactSubject"
            maxlength="100"
            (input)="onSubjectChange()"
            required
          />
          <small *ngIf="subjectError" class="error">{{ subjectError }}</small>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea
            placeholder="Your Message"
            rows="6"
            [(ngModel)]="contactMessage"
            name="contactMessage"
            maxlength="1000"
            (input)="onMessageChange()"
            required
          ></textarea>
          <small *ngIf="messageError" class="error">{{ messageError }}</small>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
