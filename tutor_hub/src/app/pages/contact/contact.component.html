<section class="page">
  <app-toast />
  <div class="container">
    <header class="hero">
      <h2>Contact</h2>
      <p>Have a question? Send us a message and our team will respond as soon as possible.</p>
    </header>

    <div class="content">
      <div class="info">
        <div class="info-card">
          <div class="label">Email</div>
          <div class="value">support&#64;tutorhub.com</div>
        </div>
        <div class="info-card">
          <div class="label">Phone</div>
          <div class="value">+91 9630079633</div>
        </div>
        <div class="info-card">
          <div class="label">Location</div>
          <div class="value">Gyan Ganga Building, Sindh Vihar Colony, Gwalior</div>
        </div>
      </div>

      <form class="form" (ngSubmit)="submitContact()">
        <div class="form-group">
          <label>Your Name</label>
          <input
            type="text"
            placeholder="Your Name"
            [(ngModel)]="contactName"
            name="contactName"
            maxlength="33"
            pattern="[a-zA-Z\s'-]*"
            title="Name can only contain letters, spaces, hyphens, and apostrophes (max 33 characters)"
            required
          />
          <small *ngIf="contactName && !isValidName(contactName)" class="error">Name must contain letters only (max 33 characters)</small>
        </div>

        <div class="form-group">
          <label>Your Email</label>
          <input
            type="email"
            placeholder="Your Email"
            [(ngModel)]="contactEmail"
            name="contactEmail"
            pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
            title="Please enter a valid email address"
            required
          />
          <small *ngIf="contactEmail && !isValidEmail(contactEmail)" class="error">Valid email is required</small>
        </div>

        <div class="form-group">
          <label>Message</label>
          <textarea
            placeholder="Your Message"
            rows="6"
            [(ngModel)]="contactMessage"
            name="contactMessage"
            maxlength="1000"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </div>
</section>
