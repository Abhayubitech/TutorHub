<div class="min-h-screen bg-gray-50 dark:bg-slate-950 flex items-cent justify-center p-2 transition-colors duration-300">
  <div class="bg-white dark:bg-slate-900 w-full max-w-3xl rounded-2xl shadow-xl overflow-hidden transition-colors duration-300 border border-transparent dark:border-slate-800">
    
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 px-8 py-4 text-white flex justify-between items-center">
      <div>
        <h2 class="text-3xl font-bold">Edit Profile</h2>
        <p class="text-blue-100 mt-1">Update your personal information</p>
      </div>
      <button (click)="goBack()" class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="p-8 space-y-6 overflow-y-auto h-[calc(100vh-200px)] md:h-[65vh]">
      <form (ngSubmit)="onSubmit()" id="profileForm">
        
        @if (user?.role !== 'admin') {
          <div class="flex items-center gap-6 pb-6 border-b border-gray-100 dark:border-slate-800">
            <div class="w-24 h-24 rounded-full bg-gray-200 dark:bg-slate-700 border-4 border-white dark:border-slate-600 shadow-lg overflow-hidden relative group">
              
              @if (imagePreview()) {
                <img [src]="imagePreview()" class="w-full h-full object-cover">
              } @else {
                <img [src]="user?.profile_pic ? 'http://localhost:3000/uploads/' + user.profile_pic : 'https://cdn-icons-png.flaticon.com/512/149/149071.png'" 
                     class="w-full h-full object-cover" 
                     alt="Profile Photo">
              }

            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-2">Profile Photo</label>
              <input type="file" (change)="onFileSelected($event)" 
                     class="block w-full text-sm text-gray-500 dark:text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 dark:file:bg-blue-900/30 file:text-blue-700 dark:file:text-blue-300 hover:file:bg-blue-100 dark:hover:file:bg-blue-900/50 transition"/>
              <p class="text-xs text-gray-400 dark:text-slate-500 mt-1">JPG, PNG or GIF (Max 2MB)</p>
            </div>
          </div>
        }

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
          <div>
            <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Full Name</label>
            <input type="text" [(ngModel)]="formData.name" name="name" 
                   class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900" placeholder="John Doe">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Email Address</label>
            <input type="email" [(ngModel)]="formData.email" name="email" 
                   class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900" placeholder="john@example.com">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Phone Number</label>
            <input type="text" [(ngModel)]="formData.phone" name="phone" 
                   class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900" placeholder="+91 9876543210">
          </div>
          
          @if (user?.role !== 'admin') {
            <div>
              <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Address</label>
              <input type="text" [(ngModel)]="formData.address" name="address" 
                     class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900" placeholder="City, State">
            </div>
          }
        </div>

        @if (user?.role === 'student') {
          <div class="pt-4 border-t border-gray-100 dark:border-slate-800 mt-4">
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">Student Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">School / College</label>
                <input type="text" [(ngModel)]="formData.school_name" name="school_name" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900">
              </div>
              <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Grade / Class</label>
                <input type="text" [(ngModel)]="formData.grade" name="grade" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900">
              </div>
            </div>
          </div>
        }

        @if (user?.role === 'teacher') {
          <div class="pt-4 border-t border-gray-100 dark:border-slate-800 mt-4">
            <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4">Teacher Details</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4">
               <div>
                 <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Qualifications</label>
                 <input type="text" [(ngModel)]="formData.qualifications" name="qualifications" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900">
               </div>
               <div>
                 <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Experience (Years)</label>
                 <input type="number" [(ngModel)]="formData.experience" name="experience" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900">
               </div>
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 dark:text-slate-300 mb-1">Bio</label>
              <textarea [(ngModel)]="formData.bio" name="bio" rows="3" class="w-full px-4 py-3 rounded-lg border border-gray-200 dark:border-slate-700 bg-gray-50 dark:bg-slate-800 text-gray-900 dark:text-white focus:border-blue-500 dark:focus:ring-blue-900 outline-none transition focus:bg-white dark:focus:bg-slate-900"></textarea>
            </div>
          </div>
        }
      </form>
    </div>

    <div class="flex justify-end gap-4 p-8 border-t border-gray-100 dark:border-slate-800  ">
      <button type="button" (click)="goBack()" class="px-6 py-3 rounded-lg font-bold text-gray-500 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition">Cancel</button>
      <button type="submit" form="profileForm" class="px-8 py-3 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 shadow-lg shadow-blue-500/30 transition transform active:scale-95">
        Save Changes
      </button>
    </div>

  </div>
</div>
