<div class="forgot-password-container">
  <div class="logo-header">
    <h1 class="logo" (click)="goHome()">
      <span class="logo-icon">🎓</span> TutorHub
    </h1>
  </div>
  
  <div class="forgot-password-card">
    <h2>Forgot Password</h2>
    <p class="subtitle">Enter your email address and we'll send you instructions to reset your password.</p>

    @if (error()) {
      <div class="error-message">{{ error() }}</div>
    }

    @if (showSuccess()) {
      <div class="success-message">
        <div class="success-icon">✓</div>
        <div>{{ message() }}</div>
        <div class="redirect-info">Redirecting to login page...</div>
      </div>
    }

    @if (!showSuccess()) {
      <form (ngSubmit)="sendResetLink()">
        <div class="form-group">
          <label>Email Address</label>
          <input
            type="email"
            placeholder="Enter your email address"
            [(ngModel)]="email"
            [ngModelOptions]="{ updateOn: 'blur' }"
            name="email"
            maxlength="50"
            pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$"
            required
            title="Please enter a valid email address"
            [disabled]="isLoading()"
          >
          <small>Example: user&#64;example.com</small>
        </div>

        <button
          type="submit"
          class="reset-btn"
          [disabled]="isLoading() || !email()"
        >
          {{ isLoading() ? 'Sending...' : 'Send Reset Link' }}
        </button>
      </form>
    }

    <p class="back-to-login">
      <a (click)="goToLogin()">← Back to Login</a>
    </p>
  </div>
</div>
