<div *ngIf="isVisible" class="fixed inset-0 z-50 flex items-center justify-center">
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-black bg-opacity-50 transition-opacity" (click)="onCancel()"></div>
  
  <!-- Dialog -->
  <div class="relative bg-white rounded-lg shadow-xl max-w-md w-full mx-4 transform transition-all">
    <div class="p-6">
      <!-- Icon and Title -->
      <div class="flex items-center mb-4">
        <div class="flex-shrink-0 mr-3">
          <!-- Warning Icon -->
          <svg *ngIf="type === 'warning'" class="w-6 h-6 text-yellow-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <!-- Danger Icon -->
          <svg *ngIf="type === 'danger'" class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
          <!-- Info Icon -->
          <svg *ngIf="type === 'info'" class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        <h3 class="text-lg font-semibold text-gray-900">{{ title }}</h3>
      </div>
      
      <!-- Message -->
      <p class="text-gray-600 mb-6">{{ message }}</p>
      
      <!-- Buttons -->
      <div class="flex justify-end space-x-3">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
        >
          {{ cancelText }}
        </button>
        <button
          type="button"
          (click)="onConfirm()"
          class="px-4 py-2 {{ buttonClass }} rounded-md transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2"
        >
          {{ confirmText }}
        </button>
      </div>
    </div>
  </div>
</div>
