<div class="toast-container">
  @for (toast of toasts(); track toast.id) {
    <div class="toast toast-{{ toast.type }}" [attr.aria-label]="toast.type + ': ' + toast.message">
      <div class="toast-icon">{{ getToastIcon(toast.type) }}</div>
      <div class="toast-message">{{ toast.message }}</div>
      <button class="toast-close" (click)="remove(toast.id)" aria-label="Close notification">×</button>
    </div>
  }
</div>
