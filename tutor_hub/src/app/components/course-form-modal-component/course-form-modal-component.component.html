<div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 transition-all duration-300 animate-fade-in" 
     (click)="close.emit()">
    
    <div class="bg-white dark:bg-slate-800 w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden transform transition-all animate-scale-in relative flex flex-col max-h-[90vh]" 
         (click)="$event.stopPropagation()">

        <div class="px-8 py-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center bg-gradient-to-r from-emerald-50 to-white dark:from-slate-800 dark:to-slate-800">
            <div>
                <h2 class="text-2xl font-black text-slate-800 dark:text-white tracking-tight">
                    {{ courseData() ? 'Edit Course' : 'Create Course' }}
                </h2>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Fill in the details below.</p>
            </div>
            <button (click)="close.emit()" class="text-slate-400 hover:text-rose-500 hover:bg-rose-50 p-2 rounded-full transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <div class="p-8 overflow-y-auto custom-scrollbar">
            <form (ngSubmit)="onSubmit()" class="space-y-5">
                
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Course Title</label>
                    <input type="text" [(ngModel)]="form.title" name="title" required 
                           placeholder="e.g. Master Angular 18"
                           class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:bg-slate-600">
                </div>

                <div class="grid grid-cols-2 gap-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Subject</label>
                        <div class="relative">
                            <select [(ngModel)]="form.subject" name="subject" required
                                    class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all appearance-none dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:bg-slate-600">
                                <option value="" disabled>Select...</option>
                                <option value="Web Dev">Web Dev</option>
                                <option value="Programming">Programming</option>
                                <option value="Data Science">Data Science</option>
                                <option value="Mathematics">Mathematics</option>
                                <option value="Design">Design</option>
                            </select>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Price (₹)</label>
                        <input type="number" [(ngModel)]="form.price" name="price" required 
                               placeholder="4999"
                               class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:bg-slate-600">
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Schedule</label>
                    <input type="text" [(ngModel)]="form.schedule" name="schedule" 
                           placeholder="e.g. Mon-Fri, 10 AM - 12 PM"
                           class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:bg-slate-600">
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Description</label>
                    <textarea [(ngModel)]="form.description" name="description" rows="3" 
                              placeholder="What will students learn in this course?"
                              class="w-full px-5 py-3.5 rounded-2xl border border-slate-200 bg-slate-50 text-slate-900 font-medium focus:bg-white focus:outline-none focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all resize-none dark:bg-slate-700 dark:border-slate-600 dark:text-white dark:focus:bg-slate-600"></textarea>
                </div>

                <div class="pt-4 flex gap-4">
                    <button type="button" (click)="close.emit()" 
                            class="flex-1 py-4 rounded-xl font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-all active:scale-95 dark:bg-slate-700 dark:text-slate-300 dark:hover:bg-slate-600">
                        Cancel
                    </button>
                    
                    <button type="submit" 
                            [disabled]="isSaving()"
                            class="flex-[2] py-4 rounded-xl font-bold text-white shadow-lg shadow-emerald-500/30 transition-all active:scale-95 flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed"
                            [ngClass]="courseData() ? 'bg-slate-900 hover:bg-slate-800 dark:bg-white dark:text-slate-900' : 'bg-emerald-600 hover:bg-emerald-700'">
                        
                        @if (isSaving()) {
                            <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                            Saving...
                        } @else {
                            @if (courseData()) {
                                <span>Update Course</span>
                            } @else {
                                <span class="text-xl leading-none font-light">+</span> <span>Create Course</span>
                            }
                        }
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>
