<nav class="bg-white/90 backdrop-blur-xl border-b border-slate-200 sticky top-0 z-50 transition-all duration-300 group-[.dark]:bg-slate-800/90 group-[.dark]:border-slate-700">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16 items-center">
      
      <div class="flex items-center gap-8">
        <div class="flex items-center gap-2 cursor-pointer group/logo" (click)="tabChange.emit('explore')">
          <div class="bg-indigo-600 group-hover/logo:bg-indigo-700 transition-colors text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
          </div>
          <h1 class="text-xl font-black text-slate-800 tracking-tight hidden sm:block group-[.dark]:text-white">TutorHub</h1>
        </div>

        <div class="hidden md:flex bg-slate-100/50 p-1 rounded-full border border-slate-200 group-[.dark]:bg-slate-700/50 group-[.dark]:border-slate-600">
          
          <button (click)="tabChange.emit('explore')" 
              [class]="activeTab() === 'explore' ? 'bg-white text-indigo-600 shadow-sm group-[.dark]:bg-slate-600 group-[.dark]:text-white' : 'text-slate-500 hover:text-indigo-600 group-[.dark]:text-slate-400 group-[.dark]:hover:text-indigo-400'"
              class="px-5 py-1.5 text-sm font-bold rounded-full transition-all duration-200">Explore</button>
          
          <button (click)="tabChange.emit('requested')" 
              [class]="activeTab() === 'requested' ? 'bg-white text-indigo-600 shadow-sm group-[.dark]:bg-slate-600 group-[.dark]:text-white' : 'text-slate-500 hover:text-indigo-600 group-[.dark]:text-slate-400 group-[.dark]:hover:text-indigo-400'"
              class="px-5 py-1.5 text-sm font-bold rounded-full transition-all duration-200">Requests</button>
          
          <button (click)="tabChange.emit('learning')" 
              [class]="activeTab() === 'learning' ? 'bg-white text-indigo-600 shadow-sm group-[.dark]:bg-slate-600 group-[.dark]:text-white' : 'text-slate-500 hover:text-indigo-600 group-[.dark]:text-slate-400 group-[.dark]:hover:text-indigo-400'"
              class="px-5 py-1.5 text-sm font-bold rounded-full transition-all duration-200">My Learning</button>
          
         
        </div>
      </div>

      <div class="flex-1 max-w-md px-4 hidden lg:block">
          <div class="relative group/search">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                  <svg class="h-4 w-4 text-slate-400 group-focus-within/search:text-indigo-500 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              </div>
              
              <input type="text" 
                     [ngModel]="searchTerm()" 
                     (ngModelChange)="searchTerm.set($event)"
                     placeholder="Search courses..." 
                     class="block w-full pl-10 pr-3 py-2 border border-transparent rounded-full bg-slate-100 text-slate-900 text-sm placeholder-slate-400 focus:outline-none focus:border-indigo-300 focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all group-[.dark]:bg-slate-700 group-[.dark]:text-white group-[.dark]:placeholder-slate-400 group-[.dark]:focus:bg-slate-600">
          </div>
      </div>

      <div class="flex items-center gap-3">
          <button (click)="themeToggle.emit()" class="p-2 rounded-full transition-all duration-300 transform hover:scale-110 active:scale-95 border" [ngClass]="isDarkMode() ? 'bg-slate-700 text-yellow-400 border-slate-600 shadow-md shadow-yellow-500/20' : 'bg-indigo-50 text-indigo-600 border-indigo-100 hover:bg-indigo-100'">
              @if (isDarkMode()) {
                <svg class="w-5 h-5 animate-spin-slow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
              } @else {
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
              }
          </button>
          
          <div class="h-6 w-px bg-slate-200 mx-1 group-[.dark]:bg-slate-700"></div>
          
          <button class="relative p-2 text-slate-400 hover:text-indigo-600 transition-colors bg-slate-50 hover:bg-indigo-50 rounded-full group-[.dark]:bg-slate-700 group-[.dark]:hover:text-indigo-400">
              <span class="absolute top-2 right-2 h-2 w-2 rounded-full bg-rose-500 ring-2 ring-white animate-pulse"></span>
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
          </button>

          <div class="flex items-center gap-3 cursor-pointer group/profile pl-2" (click)="tabChange.emit('profile')">
              <div class="hidden md:block text-right">
                  <p class="text-sm font-bold text-slate-800 leading-none group-hover/profile:text-indigo-600 transition-colors group-[.dark]:text-white capitalize">
                      {{ userParams().name || 'Student' }}
                  </p>
                  <p class="text-[10px] font-bold text-indigo-500 uppercase mt-0.5 tracking-wide">{{ userParams().role || 'User' }}</p>
              </div>
              <div class="h-10 w-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 p-0.5 shadow-md group-hover/profile:scale-105 transition-transform">
                  <div class="h-full w-full rounded-full bg-white flex items-center justify-center text-indigo-600 font-black text-lg group-[.dark]:bg-slate-800 group-[.dark]:text-indigo-400 uppercase">
                      {{ userParams().name?.charAt(0) || 'U' }}
                  </div>
              </div>
          </div>

          <button (click)="logout.emit()" class="ml-2 p-2 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-full transition-colors group-[.dark]:hover:bg-slate-700" title="Logout">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
          </button>
      </div>
    </div>
  </div>
</nav>
